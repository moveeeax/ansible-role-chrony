---
# defaults file for ansible-role-chrony

# Individual NTP servers to synchronise against. Each entry may be a bare
# hostname or a mapping with an "options" key for per-server chrony options.
chrony_servers:
  - "0.pool.ntp.org"
  - "1.pool.ntp.org"

# NTP pools to synchronise against. Pools are expanded by chrony into
# multiple sources at runtime.
chrony_pools:
  - name: "2.pool.ntp.org"
    options: "iburst"

# Path to the drift file that records the local clock's gain or loss rate.
chrony_driftfile: "{{ chrony_driftfile_default }}"

# Step the clock (rather than slew) if the initial offset is larger than
# this threshold, for the first N updates. Set makestep_updates to 0 to
# disable stepping entirely.
chrony_makestep_threshold: 1.0
chrony_makestep_updates: 3

# Synchronise the real-time clock from the system clock. Supported on Linux
# hosts with an RTC; harmless to leave enabled elsewhere.
chrony_rtcsync: true

# Networks permitted to use this host as an NTP server. Leave empty to run
# as a client only. Example: ["192.0.2.0/24", "10.0.0.0/8"].
chrony_allow: []

# When acting as a server, allow chrony to serve time even when it is not
# itself synchronised, at the given stratum. Set to 0 to disable.
chrony_local_stratum: 0

# Arbitrary extra directives appended verbatim to the end of chrony.conf.
# Each list item is written as its own line.
chrony_extra_config: []

# Optionally set the system timezone (as an IANA name such as
# "Europe/Berlin"). Leave empty to leave the host timezone untouched.
chrony_timezone: ""

# Use the cloud provider's own time service instead of (or alongside) the
# sources above. One of:
#   auto  - detect AWS, GCP or Azure from the gathered DMI facts and use the
#           matching source; anything else gets no cloud source
#   aws   - Amazon Time Sync Service (169.254.169.123, time.aws.com backup)
#   gcp   - the Compute Engine metadata server (metadata.google.internal)
#   azure - the Hyper-V PTP clock of the Azure host (/dev/ptp_hyperv)
#   none  - never add a cloud source
chrony_cloud_time_source: "auto"

# When a cloud source is in use, render it as the only time source and drop
# chrony_servers and chrony_pools. AWS and Google both advise against mixing
# their leap-smearing services with public NTP servers. Set to false to keep
# the sources above as well.
chrony_cloud_time_source_exclusive: true

# PTP device chrony reads the Azure host clock from. Recent Azure images
# create this udev symlink; a refclock pointing at a missing device stops
# chronyd from starting, so the role checks for it first.
chrony_azure_ptp_device: "/dev/ptp_hyperv"
