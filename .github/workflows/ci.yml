---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check ansible-core ansible-lint yamllint

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run syntax-check
        run: ansible-playbook --syntax-check -i tests/inventory tests/test.yml

      - name: Run the chrony.conf rendering tests
        run: ansible-playbook -i tests/inventory tests/render.yml

      - name: Run the preflight validation tests
        run: ansible-playbook -i tests/inventory tests/validate.yml
